services:
  - docker:28-dind

build_production:
  stage: build
  only:
    - master
  image: docker:28
  script:
    - docker build -t sjc.vultrcr.com/parrotinfra/documentation:prod .
    - echo "${DOCKER_REGISTRY_PASSWORD}" | docker login -u "${DOCKER_REGISTRY_USER}" --password-stdin sjc.vultrcr.com/parrotinfra
    - docker push sjc.vultrcr.com/parrotinfra/documentation:prod

build_beta:
  stage: build
  image: docker:28
  only:
    - dev
  script:
    - docker build -t sjc.vultrcr.com/parrotinfra/documentation-beta:latest .
    - echo "${DOCKER_REGISTRY_PASSWORD}" | docker login -u "${DOCKER_REGISTRY_USER}" --password-stdin sjc.vultrcr.com/parrotinfra
    - docker push sjc.vultrcr.com/parrotinfra/documentation-beta:latest

build_test:
  stage: build
  except:
    - dev
    - master
  image: docker:28
  artifacts:
    paths:
      - build
  script:
    - docker build -t test .
    - mkdir -p build
    - docker run --rm -v $(pwd)/build:/build test -- cp -r /usr/share/nginx/html/ /build