variables:
  DOCKER_TLS_CERTDIR: ""

image: docker:28

build_production:
  stage: build
  only:
    - master
  image: docker:28
  script:
    - docker build -t sjc.vultrcr.com/parrotinfra/documentation:prod .
    - echo "${DOCKER_REGISTRY_PASSWORD}" | docker login -u "${DOCKER_REGISTRY_USER}" --password-stdin sjc.vultrcr.com/parrotinfra
    - docker push sjc.vultrcr.com/parrotinfra/documentation:prod

build_beta:
  stage: build
  image: docker:28
  only:
    - dev
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker buildx create --use
    - echo "${DOCKER_REGISTRY_PASSWORD}" | docker login -u "${DOCKER_REGISTRY_USER}" --password-stdin sjc.vultrcr.com/parrotinfra
    - docker buildx build --push -t sjc.vultrcr.com/parrotinfra/documentation-beta:latest .

