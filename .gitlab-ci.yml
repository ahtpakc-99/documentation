default:
  image: docker:latest
  services:
    - name: docker:dind
      alias: docker
  before_script:
    - echo "${DOCKER_REGISTRY_PASSWORD}" | docker login -u "${DOCKER_REGISTRY_USER}" --password-stdin sjc.vultrcr.com/parrotinfra

variables:
  DOCKER_TLS_CERTDIR: ""

stages:
  - build
  - build_beta

build_production:
  stage: build
  only:
    - master
  script:
    - docker build -t sjc.vultrcr.com/parrotinfra/documentation:latest .
    - docker push sjc.vultrcr.com/parrotinfra/documentation:latest

build_beta:
  stage: build_beta
  only:
    - dev
  script:
    - docker build -t sjc.vultrcr.com/parrotinfra/documentation-beta:latest .
    - docker push sjc.vultrcr.com/parrotinfra/documentation-beta:latest