build_test:
  stage: build
  except:
    - dev
    - master
  image: docker:28
  artifacts:
    paths:
      - build
  script:
    - docker build -t test .
    - mkdir -p build
    - docker run --rm -v $(pwd)/build:/build test -- cp -r /usr/share/nginx/html/ /build