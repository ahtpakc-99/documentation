services:
  - docker:dind

.test: &test-script |
  docker build -t test .
  mkdir -p build
  docker run --rm -v $(pwd)/build:/build test -- cp -r /usr/share/nginx/html/ /build

.beta: &beta-script |
  docker build -t sjc.vultrcr.com/parrotinfra/documentation-beta:latest .
  docker login -u $DOCKER_REGISTRY_USER -p $DOCKER_REGISTRY_PASSWORD sjc.vultrcr.com/parrotinfra
  docker push sjc.vultrcr.com/parrotinfra/documentation-beta:latest

.prod: &prod-script |
  docker build -t sjc.vultrcr.com/parrotinfra/documentation:latest .
  docker login -u $DOCKER_REGISTRY_USER -p $DOCKER_REGISTRY_PASSWORD sjc.vultrcr.com/parrotinfra
  docker push sjc.vultrcr.com/parrotinfra/documentation:latest

build_production:
  stage: build
  only:
    - master
  image: docker:latest
  script:
    - *prod-script

build_beta:
  stage: build
  only:
    - dev
  image: docker:latest
  script:
    - *beta-script

build_test:
  stage: build
  except:
    - dev
    - master
  image: docker:latest
  artifacts:
    paths:
      - build
  script:
    - *test-script