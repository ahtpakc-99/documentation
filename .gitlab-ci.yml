default:
  image: docker:latest
  tags:
    - docker-privileged
  services:
    - name: docker:dind
      alias: docker
  before_script:
    - echo "${DOCKER_REGISTRY_PASSWORD}" | docker login -u "${DOCKER_REGISTRY_USER}" --password-stdin sjc.vultrcr.com/parrotinfra

variables:
  DOCKER_TLS_CERTDIR: ""

stages:
  - build_beta

